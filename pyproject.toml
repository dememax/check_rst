# Packaging, test, formatting, and type-check configuration — check_rst project

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "check-rst"
dynamic = ["version"]
description = "Deterministic checking, fixing, and structural queries for reStructuredText and Sphinx"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-only"
authors = [
    { name = "Maxime P. DEMENTYEV", email = "dememax@hotmail.com" },
]
# Run-time dependencies: needed for check_rst to FUNCTION once installed —
# `pip install check-rst` always pulls these in, the same as any executable's
# own library dependencies.
dependencies = [
    "docutils>=0.22.4,<0.24",
    "Sphinx>=9.1,<10",
    "snowballstemmer>=3.1,<4",
    "pygit2>=1.19,<2",
]

# Compile-time (dev-only) dependencies: mypy type-checks this project's own
# source — useless to someone who has installed check_rst to run it as an
# executable, so it lives here, pulled in only by `pip install
# check-rst[dev]`, never by a plain `pip install check-rst`. Ruff is NOT
# part of this extra: it stays the system executable AGENTS.md's validation
# section calls for, self-checked via [tool.ruff].required-version below
# rather than pip-installed. Same "tested claim, not a guess" category as
# `dependencies` above (AGENTS.md, "Packaging and compatibility") — but this
# claim is about developer-tooling reproducibility, not what check_rst needs
# to run.
[project.optional-dependencies]
# Both bounds are floor-and-ceiling of what was actually run (2026-08-12),
# not a guessed next-major-version cutoff: mypy 2.2/2.3 and this exact
# types-docutils snapshot. Pinned because mypy's own findings for
# Docutils-touched code depend entirely on which dated snapshot of
# types-docutils resolves a given attribute/return type — confirmed
# directly that an environment with NO stub for docutils at all (neither
# docutils itself nor mypy ships one) makes every docutils value silently
# resolve as Any, passing cleanly while checking nothing, while an older or
# newer types-docutils snapshot reports a genuinely different error set for
# the exact same source. Without both bounds, "mypy passes" is not a
# reproducible claim across machines or across time on the same machine.
dev = [
    "mypy>=2.2,<2.4",
    "types-docutils==0.22.3.20260724",
]

[project.scripts]
check_rst = "check_rst.cli:main"

[project.urls]
Repository = "https://github.com/dememax/check_rst"
Documentation = "https://github.com/dememax/check_rst/blob/main/docs/guide.rst"

[tool.setuptools.dynamic]
version = { attr = "check_rst.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: pure-function tests with no filesystem or Git",
    "integration: tests that create files or run Git commands",
]

[tool.ruff]
line-length = 120
target-version = "py314"
required-version = ">=0.16.1,<=0.16.2"

[tool.ruff.lint]
# B:   flake8-bugbear (design/logic issues)
# E4/E7/E9: pycodestyle (imports, statements, syntax errors)
# F:   pyflakes (undefined names, unused imports)
# UP:  pyupgrade (modernize syntax to 3.14)
# I:   isort (import ordering)
# RUF: ruff-specific rules
# SIM: flake8-simplify (code simplification)
# PT:  flake8-pytest-style (pytest standards)
# ANN: flake8-annotations (enforce type hints)
# TCH: flake8-type-checking (manage typing imports)
select = ["B", "E4", "E7", "E9", "F", "UP", "I", "RUF", "SIM", "PT", "ANN", "TCH"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "docutils.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "snowballstemmer"
ignore_missing_imports = true
